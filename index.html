<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HACK PAD - TERMINEL v1.0</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #00cc33;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(0,204,51,0.015) 3px, rgba(0,204,51,0.015) 6px);
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
    }

    header {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .title-wrapper {
      position: relative;
      display: inline-block;
      perspective: 800px;
    }

    h1 {
      font-size: 2.8rem;
      color: #00ff44;
      text-shadow: 0 0 8px rgba(0,255,68,0.4);
      letter-spacing: 1.5px;
      transform-style: preserve-3d;
      transition: transform 0.5s ease-out;
      margin: 0;
      white-space: nowrap;
    }

    .subtitle {
      color: #00aa33;
      font-size: 1.05rem;
      margin-top: 6px;
      opacity: 0.92;
      letter-spacing: 0.5px;
      text-shadow: 0 0 4px rgba(0,204,51,0.3);
    }

    .editor-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      border: 1px solid #006622;
      border-radius: 3px;
      overflow: hidden;
      background: #000811;
      position: relative;
    }

    .toolbar {
      background: #000a00;
      border-bottom: 1px solid #006622;
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 3;
    }

    button {
      background: #001100;
      color: #00cc33;
      border: 1px solid #006622;
      padding: 8px 16px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #003300;
      color: #00ff66;
      border-color: #00cc33;
      box-shadow: 0 0 10px rgba(0,204,51,0.25);
    }
    #fileInput { display: none; }

    #notepad-container {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    #matrix-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.22;
    }

    #notepad {
      position: relative;
      z-index: 2;
      height: 100%;
      background: transparent;
      color: #00ff44;
      padding: 16px 20px;
      font-size: 1.15rem;
      line-height: 1.55;
      outline: none;
      white-space: pre-wrap;
      overflow-y: auto;
      caret-color: transparent;
    }

    #notepad:empty::before {
      content: ">> ENTER TEXT OR LOAD FILE...";
      color: #004d1a;
    }

    #stats {
      text-align: right;
      color: #009922;
      font-size: 0.95rem;
      padding: 6px 12px;
      background: #000a00;
      border-top: 1px solid #004d1a;
      z-index: 3;
    }

    .footer {
      text-align: center;
      padding: 12px 0;
      color: #006622;
      font-size: 0.95rem;
      border-top: 1px solid #004d1a;
      text-shadow: 0 0 6px rgba(0,204,51,0.3);
      animation: soft-glow 4s ease-in-out infinite alternate;
    }

    @keyframes soft-glow {
      from { text-shadow: 0 0 6px rgba(0,204,51,0.3); }
      to   { text-shadow: 0 0 12px rgba(0,204,51,0.6); }
    }

    .footer a {
      color: #00ff66;
      text-decoration: none;
      font-weight: 500;
      text-shadow: 0 0 8px rgba(0,255,102,0.6);
      transition: all 0.3s;
    }

    .footer a:hover {
      color: #33ff99;
      text-shadow: 0 0 16px rgba(51,255,153,0.9);
      transform: translateY(-1px);
    }

    #notepad::-webkit-scrollbar { width: 10px; }
    #notepad::-webkit-scrollbar-track { background: #000; }
    #notepad::-webkit-scrollbar-thumb { background: #006622; }
    #notepad::-webkit-scrollbar-thumb:hover { background: #009922; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-wrapper">
        <h1>HACK PAD - TERMINAL</h1>
      </div>
      <p class="subtitle">root@session:~/notes # autosave active</p>
    </header>

    <div class="editor-wrapper">
      <div class="toolbar">
        <button onclick="document.getElementById('fileInput').click()">OPEN FILE</button>
        <button onclick="saveAs()">SAVE AS...</button>
        <button onclick="clearNotes()">CLEAR BUFFER</button>
      </div>

      <div id="notepad-container">
        <canvas id="matrix-bg"></canvas>
        <div id="notepad" contenteditable="true"></div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="text/plain,.txt,.md,.js,.json" />

    <div id="stats">CHAR: 0 | WORDS: 0</div>

    <div class="footer">
      Made by DreamXHava - 
      <a href="https://github.com/Savindudam" target="_blank">More Projects</a>
    </div>
  </div>

  <script>
    <script>
const titleEl = document.querySelector('h1');

document.addEventListener('mousemove', (e) => {
  const dx = (e.clientX / window.innerWidth - 0.5) * 20;
  const dy = (e.clientY / window.innerHeight - 0.5) * 12;

  titleEl.style.transform =
    `translate(${dx}px, ${dy}px) rotateX(${dy * 0.2}deg) rotateY(${dx * 0.3}deg)`;
});

const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = canvas.parentElement.offsetWidth;
  canvas.height = canvas.parentElement.offsetHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const glyphs =
  '01アイウエオカキクケコABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%';
const fontSize = 16;

let columns = Math.floor(canvas.width / fontSize);
let rain = new Array(columns).fill(0).map(() => Math.random() * -50);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#009922';
  ctx.font = `${fontSize}px JetBrains Mono`;

  rain.forEach((y, i) => {
    const char = glyphs[Math.floor(Math.random() * glyphs.length)];
    ctx.fillText(char, i * fontSize, y * fontSize);

    if (y * fontSize > canvas.height && Math.random() > 0.97) {
      rain[i] = 0;
    } else {
      rain[i] += 0.9;
    }
  });
}

setInterval(drawMatrix, 50);



const editor = document.getElementById('notepad');
const stats  = document.getElementById('stats');
const fileIn = document.getElementById('fileInput');

const STORAGE_KEY = 'hackPadNotes';

// Restore last session if available
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) {
  editor.innerHTML = saved;
  updateStats();
}

// Save on every change (cheap enough for text)
editor.addEventListener('input', () => {
  localStorage.setItem(STORAGE_KEY, editor.innerHTML);
  updateStats();
});

function updateStats() {
  const text = editor.innerText || '';
  const words = text.trim().split(/\s+/).filter(Boolean);

  stats.textContent =
    `CHAR: ${text.length} | WORDS: ${words.length}`;
}



fileIn.addEventListener('change', () => {
  const file = fileIn.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    editor.innerText = reader.result;
    localStorage.setItem(STORAGE_KEY, editor.innerHTML);
    updateStats();
  };

  reader.readAsText(file);
  fileIn.value = '';
});


async function saveAs() {
  const text = editor.innerText || '';
  if (!text.trim()) {
    alert('Nothing to save yet.');
    return;
  }

  try {
    if (window.showSaveFilePicker) {
      const handle = await showSaveFilePicker({
        suggestedName: 'notes.txt'
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
    } else {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = 'notes.txt';
      a.click();

      URL.revokeObjectURL(url);
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      alert('Could not save the file.');
    }
  }
}

function clearNotes() {
  if (!confirm('Clear everything?')) return;

  editor.innerHTML = '';
  localStorage.removeItem(STORAGE_KEY);
  updateStats();
}

// Autofocus feels natural for a pad
editor.focus();
updateStats();
</script>

  </script>
</body>

































































</html>
